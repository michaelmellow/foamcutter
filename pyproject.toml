[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foamcutter"
version = "0.0.0"
description = "Tools for a 4-axis hot-wire foam cutter: CAM core, STEP front end, simulator."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]
# Third-party libraries for each package. tests/step/ is skipped when any
# library in the step group is not installed.
cam = []
step = []
sim = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["output"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
# Only the packages are checked, not tests/.
# temporary: remove when the first tests exist
packages = ["foamcam", "foamstep", "foamsim"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foamcutter"
version = "0.0.0"
description = "Tools for a 4-axis hot-wire foam cutter: CAM core, STEP front end, simulator."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
]
# Third-party libraries for each package. tests/step/ is skipped when any
# library in the step group is not installed.
cam = [
    "PyYAML>=6",
]
step = []
sim = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["output"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests"]
# Module names come from the directory layout, so tests/*/conftest.py files
# in different areas do not clash.
explicit_package_bases = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

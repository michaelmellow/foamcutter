[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foamcutter"
version = "0.0.0"
description = "Tools for a 4-axis hot-wire foam cutter: CAM core, STEP front end, simulator."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "types-PyYAML",
    "types-pyserial",
]
# Third-party libraries for each package. tests/step/ is skipped when any
# library in the step group is not installed.
cam = [
    "PyYAML>=6",
]
step = []
dxf = [
    "PyYAML>=6",
    "ezdxf>=1.1",
    "pyserial>=3.5",  # Machine tab: send G-code to grblHAL (foamdxf.sender)
]
# Optional: STEP models in the DXF front end (foamdxf.step). tests/dxf/test_step.py
# is skipped when gmsh is not installed or cannot load.
dxf-step = [
    "gmsh>=4.11",
]
sim = [
    "PyYAML>=6",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["output"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests"]
# Module names come from the directory layout, so tests/*/conftest.py files
# in different areas do not clash.
explicit_package_bases = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

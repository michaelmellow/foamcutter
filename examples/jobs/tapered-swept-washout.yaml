# Worked example 2: tapered, swept panel with washout.
# Clark Y, chord 240 mm at the root and 150 mm at the tip.
# Sweep: the tip leading edge is 60 mm further aft (toward +x) than the root's.
# Washout: the tip is twisted 3 degrees leading edge down about its quarter chord.
# For the sample profile: examples/profiles/sample-machine.yaml
format: "foamcutter-job"
version: 1
name: "tapered swept wing with washout, Clark Y 240-150"
kerf_table: "eps-20-sample"
cut_speed: 150.0
direction: "upper_first"
max_segment_length: 1.0
min_te_thickness: 0.6
lead_in: 20.0
safe_position: [500.0, 200.0, 500.0, 200.0]
mirror: false
block: { x: 100.0, length: 280.0, height: 60.0 }
root:
  shape: { dat: "../airfoils/clarky.dat" }
  chord: 240.0
  twist: 0.0
  twist_axis: 0.25
  position: { x: 180.0, y: 150.0, z: 22.0 }   # LE at x = 120, TE at x = 360
tip:
  shape: { dat: "../airfoils/clarky.dat" }
  chord: 150.0
  twist: -3.0
  twist_axis: 0.25
  position: { x: 217.5, y: 750.0, z: 22.0 }   # LE at x = 180 (60 mm aft), TE near x = 330

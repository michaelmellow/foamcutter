# Worked example 1: straight wing panel.
# E205 airfoil, constant 200 mm chord, no twist, no sweep.
# For the sample profile: examples/profiles/sample-machine.yaml
format: "foamcutter-job"
version: 1
name: "straight wing, E205, 200 mm chord"
kerf_table: "eps-20-sample"
cut_speed: 150.0
direction: "upper_first"
max_segment_length: 1.0
min_te_thickness: 0.6
lead_in: 20.0
safe_position: [500.0, 200.0, 500.0, 200.0]
mirror: false
block: { x: 100.0, length: 240.0, height: 50.0 }
root:
  shape: { dat: "../airfoils/e205.dat" }
  chord: 200.0
  twist: 0.0
  twist_axis: 0.25
  position: { x: 170.0, y: 150.0, z: 20.0 }   # LE at x = 120, TE at x = 320
tip:
  shape: { dat: "../airfoils/e205.dat" }
  chord: 200.0
  twist: 0.0
  twist_axis: 0.25
  position: { x: 170.0, y: 750.0, z: 20.0 }

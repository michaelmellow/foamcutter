# Worked example 3: tapered panel with a spar slot.
# E205, chord 220 mm at the root and 150 mm at the tip, no sweep of the 30 % line.
# A 10 x 6 mm rectangular spar slot, reached through a slit from the lower surface.
# For the sample profile: examples/profiles/sample-machine.yaml
format: "foamcutter-job"
version: 1
name: "tapered wing with spar slot, E205 220-150"
kerf_table: "eps-20-sample"
cut_speed: 150.0
direction: "upper_first"
max_segment_length: 1.0
min_te_thickness: 0.6
lead_in: 20.0
safe_position: [500.0, 200.0, 500.0, 200.0]
mirror: false
block: { x: 100.0, length: 260.0, height: 50.0 }
root:
  shape: { dat: "../airfoils/e205.dat" }
  chord: 220.0
  twist: 0.0
  twist_axis: 0.3
  position: { x: 186.0, y: 150.0, z: 20.0 }   # LE at x = 120, TE at x = 340
  features:
    - name: "spar"
      kind: "hole"
      slit: "lower"
      points: [[61.0, 3.0], [71.0, 3.0], [71.0, 9.0], [61.0, 9.0]]
tip:
  shape: { dat: "../airfoils/e205.dat" }
  chord: 150.0
  twist: 0.0
  twist_axis: 0.3
  position: { x: 186.0, y: 750.0, z: 20.0 }   # LE at x = 141, TE at x = 291
  features:
    - name: "spar"
      kind: "hole"
      slit: "lower"
      points: [[40.0, 2.0], [50.0, 2.0], [50.0, 8.0], [40.0, 8.0]]

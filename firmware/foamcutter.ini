# PlatformIO environments for the foam cutter build of grblHAL.
#
# This file is copied into a checkout of https://github.com/dresco/STM32H7xx
# by firmware/build.py and used with "pio run -c foamcutter.ini". It pulls in
# the upstream platformio.ini so the [common], [usb_h7xx] sections are reused
# unchanged, and adds two environments of our own.
#
# Two MCU variants are built because BTT's SKR 3 EZ manual and schematic show
# an STM32H743VI, while the project brief states STM32H723. Flash the one that
# matches the chip marking on your board (see firmware/README.md).

[platformio]
extra_configs = platformio.ini
include_dir = Inc
src_dir = Src

[foamcutter]
# Exact package versions, so every computer compiles with the same toolchain.
# The ststm32 platform alone would accept any toolchain from 1.60301.0 up.
platform = ststm32@20.0.0
platform_packages =
  framework-stm32cubeh7 @ 1.12.1
  toolchain-gccarmnoneeabi @ 1.70201.0
build_flags =
  # Board map boards/btt_skr_v3.0_map.h ("BTT SKR 3 / SKR 3 EZ")
  -D BOARD_BTT_SKR_30
  # 25 MHz crystal (Y1 on the SKR 3 EZ schematic); the map refuses other values
  -D HSE_VALUE=25000000
  # 4 axes: X, Y, Z and a 4th axis on driver slot E0 (M3 in the board map)
  -D N_AXIS=4
  # TMC2209 over UART; the core turns on TRINAMIC_UART_ENABLE for 2209
  -D TRINAMIC_ENABLE=2209
  # All 4 axes are linear. Without this the 4th axis (letter A) defaults to
  # rotary ($376), which changes G94 feed handling and inch scaling.
  -D DEFAULT_AXIS_ROTATIONAL_MASK=0
lib_deps =
  motors
  trinamic

# STM32H743VI, 128 KB BTT bootloader (application at 0x08020000)
[env:foamcutter_skr3ez_h743_bl128]
platform = ${foamcutter.platform}
platform_packages = ${foamcutter.platform_packages}
board = generic_stm32h743vi
board_build.ldscript = STM32H743VITX_BL_FLASH.ld
build_flags = ${common.build_flags}
              ${usb_h743.build_flags}
              ${foamcutter.build_flags}
lib_deps = ${common_h743.lib_deps}
           ${usb_h743.lib_deps}
           ${foamcutter.lib_deps}
lib_extra_dirs = ${common.lib_extra_dirs}
                 ${usb_h743.lib_extra_dirs}

# STM32H723VG, 128 KB BTT bootloader (application at 0x08020000)
[env:foamcutter_skr3ez_h723_bl128]
platform = ${foamcutter.platform}
platform_packages = ${foamcutter.platform_packages}
board = generic_stm32h723vg
board_build.ldscript = STM32H723VGTX_BL_FLASH.ld
build_flags = ${common.build_flags}
              ${usb_h723.build_flags}
              ${foamcutter.build_flags}
lib_deps = ${common_h723.lib_deps}
           ${usb_h723.lib_deps}
           ${foamcutter.lib_deps}
lib_extra_dirs = ${common.lib_extra_dirs}
                 ${usb_h723.lib_extra_dirs}
